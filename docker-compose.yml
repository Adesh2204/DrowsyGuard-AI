services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drowsyguard-backend
    ports:
      - "8000:8000"
    environment:
      - DG_MODEL_DEVICE=cpu
      - DG_ALLOWED_ORIGINS=["http://localhost:3000"]
    volumes:
      - ./backend/weights:/app/weights
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drowsyguard-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/live-detection
    depends_on:
      - backend
    restart: unless-stopped
